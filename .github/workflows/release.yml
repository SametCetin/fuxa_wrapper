# Release: main dalındaki bir commit'e V<sürüm> etiketi gönderilince, ör. V27.1.10.26
#   npm run version:set -- 27.1.10.26 → commit → git tag V27.1.10.26 → git push --follow-tags
# Windows'ta test eder, üç çıktıyı derler ve GitHub Release olarak yayınlar:
#   fuxaw-setup-<sürüm>.exe        fuxaw kurulum paketi (NSIS)
#   latest.yml, fuxaw-setup-<sürüm>.exe.blockmap   uygulama içi güncelleme (electron-updater; src/main/updater.js)
#   fuxaw-win-x64-<sürüm>.zip      kurulumsuz fuxaw (win-unpacked klasörü)
#   install-fuxa.cmd, uninstall-fuxa.cmd   hedef makine kurulumu (tek dosya; npm run dist:installer)
# <sürüm> package.json fullVersion'dur (dört parça); npm/Electron'un üç parçalı version'ı ondan türetilir
# (26.1.10.22 → 26.1.10022, src/core/version.js). Kurulu uygulamalar bu release'in latest.yml'ini okuyup günceller;
# release taslak/ön sürüm olmamalı (güncelleyici GitHub'ın "latest" release'ine bakar).
# EXE'ler imzasızdır (SmartScreen uyarısı verir).
name: Release

on:
  push:
    tags: ['V*', 'v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Etiket main üzerinde ve package.json sürümüyle aynı mı
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE) { throw "Etiket ($env:GITHUB_REF_NAME) main dalındaki bir commit'te değil." }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = if ($pkg.fullVersion) { $pkg.fullVersion } else { $pkg.version }
          if ($env:GITHUB_REF_NAME.Substring(1) -ne $version) { throw "Etiket $env:GITHUB_REF_NAME, package.json sürümü $version. Önce 'npm run version:set -- <sürüm>'." }
          "VERSION=$version" >> $env:GITHUB_ENV

      # Node 22 (npm 10): bağımlılıkların kurulum betikleri çalışır; fuxa-runtime'daki sqlite3'ün derlenmiş dosyası böyle iner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall burada kullanılmaz: npm 10'da lifecycle içinden çalışan `npm install --prefix fuxa-runtime`
      # kök projeyi yeniden kurup postinstall'ı tekrar tetikliyor (sonsuz döngü). Aynı adımlar tek tek, kilit dosyalarıyla.
      - name: Bağımlılıklar (Electron, gömülü FUXA, ADS eklentisi)
        shell: bash  # ilk hatada durur (pwsh çok satırlı adımda sadece son komutun çıkış kodunu sayar)
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npm ci --prefix fuxa-runtime --no-audit --no-fund
          npm ci --prefix integrations/native-ads --no-audit --no-fund
          npm run setup:ads

      - name: Test
        run: npm test

      - name: fuxaw kurulum paketi (NSIS)
        run: npm run dist -- --publish never

      - name: Kurulumsuz fuxaw (Hızlı EXE)
        run: npm run dist:fast -- --publish never

      - name: Hedef makine kurulumu
        run: npm run dist:installer

      - name: Release dosyalarını topla
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force release
          # Kurulum paketi adı tam sürümle (artifactName ${buildVersion}); latest.yml bu adı ve SHA512'yi taşır, adı değişmemeli.
          $setup = "dist/fuxaw-setup-$env:VERSION.exe"
          foreach ($f in $setup, "$setup.blockmap", 'dist/latest.yml') {
            if (-not (Test-Path $f)) { throw "$f yok (electron-builder publish ayarı / artifactName)." }
            Copy-Item $f $out
          }
          if (-not (Select-String -Path dist/latest.yml -SimpleMatch "fuxaw-setup-$env:VERSION.exe" -Quiet)) { throw 'latest.yml kurulum paketinin adını içermiyor.' }
          7z a -tzip "$out/fuxaw-win-x64-$env:VERSION.zip" ./dist/fast/win-unpacked/* | Out-Null
          if ($LASTEXITCODE) { throw '7z zip oluşturamadı.' }
          $inst = Get-ChildItem dist/installer -Directory | Select-Object -First 1
          Copy-Item (Join-Path $inst.FullName 'install-fuxa.cmd'), (Join-Path $inst.FullName 'uninstall-fuxa.cmd') $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem release).FullName --title "fuxaw V$env:VERSION" --generate-notes --verify-tag
